[project]
name = "s2m2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy<2.0.0",
    "opencv-python<4.11",
    "tomli>=2.4.0",
    "ultralytics>=8.4.7",
    "torch",
    "torchvision",
    "torchaudio",
    "open3d>=0.19.0",
    "onnx>=1.20.1",
    "onnxruntime-gpu>=1.23.2",
    "onnxscript>=0.6.0",
    "tensorrt-cu13"
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
tensorrt-cu13 = { index = "nvidia" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2m2"]
